version: 0.2

env:
  shell: bash

phases:
  install:
    runtime-versions:
      nodejs: 24
    commands:
      - node --version
      - npm --version
      - npm --prefix ha-root/front ci

  pre_build:
    commands:
      - |
        if [ -z "${API_BASE_URL:-}" ]; then
          echo "ERROR: API_BASE_URL is not configured in the CodeBuild project."
          exit 1
        fi
        echo "API_BASE_URL is configured."

  build:
    commands:
      - npm --prefix ha-root/front run generate:dev
      - test -d ha-root/front/.output/public
      - test -n "$(find ha-root/front/.output/public -type f -print -quit)"

artifacts:
  base-directory: ha-root/front/.output/public
  files:
    - '**/*'
  discard-paths: no

cache:
  paths:
    - '/root/.npm/**/*'
