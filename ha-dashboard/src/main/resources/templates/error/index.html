<!DOCTYPE html>
<html lang="ja"
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  th:replace="~{layout/template :: layout(~{::title},~{::body/content()},~{::link})}">
<head>
<title>エラー</title>
<link>
</head>
<body>

  <div class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-10 col-lg-8">
        <div class="card shadow border-0 rounded">
          <div class="card-header bg-danger text-white">
            <h4 class="mb-0">🚫 エラーが発生しました</h4>
          </div>

          <div class="card-body bg-white">

            <!-- エラーメッセージ -->
            <div class="alert alert-danger" role="alert" th:text="${errorMessage}">
              予期しないエラーが発生しました。しばらくしてから再度お試しください。
            </div>

              <div class="mt-5 text-center text-muted small">
                <p>
                  ご不明な点がある場合は、<br>
                  <a href="mailto:support@example.com">support@example.com</a> までご連絡ください。<br>
                  または<a th:href="@{/inquiry/input}" class="btn btn-link btn-sm">お問い合わせフォーム</a>をご利用ください。
                </p>
              </div>


            <div class="text-center mt-4">
              <a href="/" class="btn btn-secondary">トップへ戻る</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
