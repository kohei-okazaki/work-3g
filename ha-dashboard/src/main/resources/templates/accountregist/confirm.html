<!DOCTYPE html>
<html lang="ja"
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  th:replace="~{layout/template :: layout(~{::title},~{::body/content()},~{::link})}">
<head>
<title>ユーザ登録確認画面</title>
<link>
</head>
<body>

  <div class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-7">
        <!-- .card構造でヘッダーを全幅に -->
        <div class="card shadow border-0 rounded">
          <div class="card-header bg-primary text-white">
            <h4 class="mb-0">📝 ユーザ登録確認</h4>
          </div><!-- /.card-header -->

          <!-- フォームは card-body 内に -->
          <div class="card-body bg-white">
            <form th:action="@{/accountregist/complete}" method="post" th:object="${userRegistForm}">
              <table class="table table-bordered mb-4">
                <tbody>
                  <tr>
                    <th scope="row" class="w-25 bg-light" th:text="#{mailAddress}"></th>
                    <td th:text="*{mailAddress}"></td>
                  </tr>
                  <tr>
                    <th scope="row" class="w-25 bg-light" th:text="#{password}"></th>
                    <td>****</td>
                  </tr>
                  <tr>
                    <th scope="row" class="w-25 bg-light" th:text="#{genderType}"></th>
                    <td>
                      <span th:if="*{genderType} == 0">男性</span>
                      <span th:if="*{genderType} == 1">女性</span>
                    </td>
                  </tr>
                  <tr>
                    <th scope="row" class="w-25 bg-light" th:text="#{birthDate}"></th>
                    <td th:text="${#temporals.format(userRegistForm.birthDate, 'yyyy/MM/dd')}"></td>
                  </tr>
                  <tr>
                    <th scope="row" class="w-25 bg-light" th:text="#{goalWeight}">目標体重</th>
                    <td th:text="*{goalWeight} + ' kg'"></td>
                  </tr>
                  <tr>
                    <th scope="row" class="w-25 bg-light" th:text="#{remarks}"></th>
                    <td th:text="*{remarks}"></td>
                  </tr>
                </tbody>
              </table>

              <!-- ボタンエリア -->
              <div class="d-flex justify-content-between">
                <button type="submit" class="btn btn-success w-45">確 定</button>
                <button type="button" class="btn btn-secondary w-45" onclick="history.back()">戻 る</button>
              </div>
            </form>
          </div><!-- /.card-body -->
        </div><!-- /.card -->
      </div><!-- /.col-md-8 -->
    </div><!-- /.row -->
  </div><!-- /.container -->

</body>
</html>
