          description: yyyy/MM/dd HH:mm:ss。
      required:
        - seq_inquiry_mng_id
        - seq_user_id
        - responder_login_id
        - status
        - type
        - title
        - body
        - reg_date
        - update_date
    RootInquiryListResponse:
      allOf:
        - $ref: '#/components/schemas/RootSuccess'
        - type: object
          properties:
            inquiry_list:
              type: array
              items:
                $ref: '#/components/schemas/RootInquiryItem'
            paging:
              $ref: '#/components/schemas/RootPaging'
          required:
            - inquiry_list
            - paging
    RootInquiryEditRequest:
      type: object
      properties:
        status:
          type: string
          enum:
            - '00'
            - '01'
            - '02'
          description: 00:未対応、01:対応中、02:完了。未知値はデシリアライズでnullとなり必須チェックで拒否。
        seq_login_id:
          type: integer
          format: int64
          minimum: 0
          description: 対応者ログインID。実在確認やJWT主体との一致確認はしない。
      required:
        - status
        - seq_login_id
      additionalProperties: true
    RootInquiryNoticeResponse:
      allOf:
        - $ref: '#/components/schemas/RootSuccess'
        - type: object
          properties:
            count:
              type: integer
              format: int64
              description: 未削除で指定ステータスの件数。
          required:
            - count
  responses:
    RootBadRequest:
      description: Controllerの入力検証・型変換・個別の業務チェックによる400。resultは文字列1、errors[].messageは各処理のメッセージ。固有レスポンスDTOの初期値やnullable項目が付く場合がある。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RootError'
    RootInternalServerError:
      description: ControllerのBaseExceptionはapplication error.、その他の一般例外はunexpected error.。共通処理からRoot用Slackへ通知する。FilterのエラーにはこのJSON形式を保証しない。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RootError'
