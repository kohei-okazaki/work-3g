openapi: 3.1.0
info:
  title: 管理者用Root API 入出力仕様
  version: 1.0.0
  description: Excel設計書に収録された26操作の現実装に基づく入出力仕様。内部処理は同じフォルダのAPI操作ごとのMarkdown設計書を参照する。resultは文字列0/1。ログイン成功は例外としてAuthorizationヘッダーのみでJSONボディを返さない。認証フィルターの拒否・JWT解析エラーはControllerのerrors形式へ一律に変換しない。
servers:
  - url: /
    description: ha-root APIの配置先を基準にする。ホスト・ポートは実行環境に従う。
security:
  - RootBearer: []
paths:
  /api/root/healthcheck:
    get:
      operationId: rootHealthCheck
      summary: Root APIの応答を確認する
      tags:
        - HealthCheck
      security: []
      description: 個別入力・DB検査を行わず正常応答を返す。
      responses:
        '200':
          description: サーバが応答した。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RootSuccess'
              example:
                result: '0'
        '500':
          $ref: '#/components/responses/RootInternalServerError'
        default:
          description: 認証フィルターや実行環境の共通処理による応答。
      externalDocs:
        description: 内部処理のMarkdown設計書
        url: ./%E8%A8%AD%E8%A8%88%E6%9B%B8_5.0.%E3%83%98%E3%83%AB%E3%82%B9%E3%83%81%E3%82%A7%E3%83%83%E3%82%AFAPI.md
  /api/root/login:
    post:
      operationId: rootLogin
      summary: 管理者サイトへログインする
      tags:
        - Authentication
      security: []
      description: 認証フィルターがJSONを読み、管理者ログイン情報・削除状態・有効期限・パスワードを照合する。Bean Validationは使用しない。成功時は8時間有効なJWTをヘッダーに返す。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RootLoginRequest'
            example:
              seq_login_id: 1
              password: sample-password
      responses:
        '200':
          description: 認証成功。JSONボディなし。
          headers:
            Authorization:
              description: Bearer接頭辞付きのJWT。発行時点から8時間有効。
              required: true
              schema:
                type: string
              example: Bearer <JWT>
        '401':
          description: Spring Securityの既定認証失敗ハンドラーによる拒否。Root APIのresult/errors形式は返さない。
        default:
          description: JSON読込み・認証・署名鍵取得などの予期しない例外はFilterまたは実行環境の応答に従う。
      externalDocs:
        description: 内部処理のMarkdown設計書
        url: ./%E8%A8%AD%E8%A8%88%E6%9B%B8_5.1.%E3%83%AD%E3%82%B0%E3%82%A4%E3%83%B3API.md
  /api/root/account:
    get:
      tags:
        - AppUser
      operationId: rootListAppUsers
      summary: アカウント情報一覧取得API
      description: 削除されていない健康管理アプリのユーザと、健康情報ファイル設定をページ単位で取得する。管理者サイト用のログインユーザを扱うAPIとは別である。 内部処理は「設計書_5.3.1.アカウント情報一覧取得API.md」を参照する。 一覧はU.DELETE_FLAG=falseで絞り込むが、paging用の件数はUSER全件を数えるため検索条件が一致しない。
      responses:
        '200':
          description: 一覧取得に成功した。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RootAppUserListResponse'
        '400':
          $ref: '#/components/responses/RootBadRequest'
        '500':
          $ref: '#/components/responses/RootInternalServerError'
        default:
          description: JWT認証フィルタや共通HTTP処理の応答。コントローラのresult/errors形式および固定の認証エラーステータスは保証しない。
      parameters:
        - name: page
          in: query
          required: false
          description: 0始まりのページ番号。省略時0。@Decimalの上下限は両端を含む。1ページ件数はfront.account.pageの設定に従う。
          schema:
            type: integer
            format: int32
            minimum: 0
            maximum: 999999999
            default: 0
      externalDocs:
        description: 内部処理のMarkdown設計書
        url: ./%E8%A8%AD%E8%A8%88%E6%9B%B8_5.3.1.%E3%82%A2%E3%82%AB%E3%82%A6%E3%83%B3%E3%83%88%E6%83%85%E5%A0%B1%E4%B8%80%E8%A6%A7%E5%8F%96%E5%BE%97API.md
  /api/root/account/{seq_user_id}:
    put:
      tags:
        - AppUser
      operationId: rootEditAppUser
      summary: アカウント情報編集API
      description: 指定したユーザのメールアドレスとパスワード有効期限を更新する。 内部処理は「設計書_5.3.2.アカウント情報編集API.md」を参照する。 対象ユーザが存在しなければ400、message=user is not found。メールはDB共通処理でAES暗号化し、パスワード自体は変更しない。
      responses:
        '200':
          description: 処理に成功した。作成・更新内容やIDは返さない。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RootSuccess'
              example:
                result: '0'
        '400':
          $ref: '#/components/responses/RootBadRequest'
        '500':
          $ref: '#/components/responses/RootInternalServerError'
        default:
          description: JWT認証フィルタや共通HTTP処理の応答。コントローラのresult/errors形式および固定の認証エラーステータスは保証しない。
      parameters:
        - name: seq_user_id
          in: path
          required: true
          description: 64ビット符号付き整数。正数限定の検証はない。
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RootAppUserEditRequest'
            example:
              mail_address: user@example.com
              password_expire: 2030/12/31
      externalDocs:
        description: 内部処理のMarkdown設計書
        url: ./%E8%A8%AD%E8%A8%88%E6%9B%B8_5.3.2.%E3%82%A2%E3%82%AB%E3%82%A6%E3%83%B3%E3%83%88%E6%83%85%E5%A0%B1%E7%B7%A8%E9%9B%86API.md
  /api/root/apidata:
    get:
      tags:
        - ApiLog
      operationId: rootListApiLogs
      summary: API通信情報一覧取得API
      description: API通信ログを新しいログID順にページ単位で取得する。 内部処理は「設計書_5.4.API通信情報一覧取得API.md」を参照する。 応答はapi_log_listであり、ユーザIDは応答項目に含めない。DBのHTTPステータスがHttpStatusへ変換できない場合は例外となる。
      responses:
        '200':
          description: 一覧取得に成功した。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RootApiLogListResponse'
        '400':
          $ref: '#/components/responses/RootBadRequest'
        '500':
          $ref: '#/components/responses/RootInternalServerError'
        default:
          description: JWT認証フィルタや共通HTTP処理の応答。コントローラのresult/errors形式および固定の認証エラーステータスは保証しない。
      parameters:
        - name: page
          in: query
          required: false
          description: 0始まりのページ番号。省略時0。@Decimalの上下限は両端を含む。1ページ件数はfront.api.pageの設定に従う。
          schema:
            type: integer
            format: int32
            minimum: 0
            maximum: 999999999
            default: 0
      externalDocs:
        description: 内部処理のMarkdown設計書
        url: ./%E8%A8%AD%E8%A8%88%E6%9B%B8_5.4.API%E9%80%9A%E4%BF%A1%E6%83%85%E5%A0%B1%E4%B8%80%E8%A6%A7%E5%8F%96%E5%BE%97API.md
  /api/root/healthinfo:
    get:
      tags:
        - HealthInfo
      operationId: rootListHealthInfos
      summary: 健康情報一覧取得API
      description: 全ユーザの健康情報とBMI範囲マスタの肥満度ステータスをページ単位で取得する。 内部処理は「設計書_5.5.1.健康情報一覧取得API.md」を参照する。 ユーザ・削除フラグによる絞り込みは行わない。
      responses:
        '200':
          description: 一覧取得に成功した。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RootHealthInfoListResponse'
        '400':
          $ref: '#/components/responses/RootBadRequest'
        '500':
          $ref: '#/components/responses/RootInternalServerError'
        default:
          description: JWT認証フィルタや共通HTTP処理の応答。コントローラのresult/errors形式および固定の認証エラーステータスは保証しない。
      parameters:
        - name: page
          in: query
          required: false
          description: 0始まりのページ番号。省略時0。@Decimalの上下限は両端を含む。1ページ件数はfront.healthinfo.pageの設定に従う。
          schema:
            type: integer
            format: int32
            minimum: 0
            maximum: 999999999
            default: 0
      externalDocs:
        description: 内部処理のMarkdown設計書
        url: ./%E8%A8%AD%E8%A8%88%E6%9B%B8_5.5.1.%E5%81%A5%E5%BA%B7%E6%83%85%E5%A0%B1%E4%B8%80%E8%A6%A7%E5%8F%96%E5%BE%97API.md
  /api/root/healthinfo/{seq_health_info_id}:
    put:
      tags:
        - HealthInfo
      operationId: rootEditHealthInfo
      summary: 健康情報編集API
      description: 指定した健康情報の身長・体重を基に基礎健康情報計算APIを呼び出し、計算結果とBMI範囲マスタIDを更新する。 内部処理は「設計書_5.5.2.健康情報編集API.md」を参照する。 健康情報IDとseq_user_idの組み合わせがなければ400、message=health_info is not found。トークンを発行せず基礎健康情報計算APIを呼び、BMI範囲マスタIDを決めて更新する。計算API失敗やBMI範囲なしのBaseExceptionは500・application error.となり、内部エラーコードをJSONへ出さない。
      responses:
        '200':
          description: 処理に成功した。作成・更新内容やIDは返さない。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RootSuccess'
              example:
                result: '0'
        '400':
          $ref: '#/components/responses/RootBadRequest'
        '500':
          $ref: '#/components/responses/RootInternalServerError'
        default:
          description: JWT認証フィルタや共通HTTP処理の応答。コントローラのresult/errors形式および固定の認証エラーステータスは保証しない。
      parameters:
        - name: seq_health_info_id
          in: path
          required: true
          description: 64ビット符号付き整数。正数限定の検証はない。
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RootHealthInfoEditRequest'
            example:
              seq_user_id: 1
              height: 170.5
              weight: 65.2
      externalDocs:
        description: 内部処理のMarkdown設計書
        url: ./%E8%A8%AD%E8%A8%88%E6%9B%B8_5.5.2.%E5%81%A5%E5%BA%B7%E6%83%85%E5%A0%B1%E7%B7%A8%E9%9B%86API.md
  /api/root/news:
    get:
      tags:
        - News
      operationId: rootListNews
      summary: お知らせ情報一覧取得API
      description: 未削除のお知らせ情報をページ単位で検索し、各お知らせの本文JSONをS3から読み込んで返す。 内部処理は「設計書_5.6.1.お知らせ情報一覧取得API.md」を参照する。
      responses:
        '200':
          description: 一覧取得に成功した。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RootNewsListResponse'
        '400':
          $ref: '#/components/responses/RootBadRequest'
        '500':
          $ref: '#/components/responses/RootInternalServerError'
        default:
          description: JWT認証フィルタや共通HTTP処理の応答。コントローラのresult/errors形式および固定の認証エラーステータスは保証しない。
      parameters:
        - name: page
          in: query
          required: false
          description: 0始まりのページ番号。省略時0。@Decimalの上下限は両端を含む。1ページ件数はfront.news.pageの設定に従う。
          schema:
            type: integer
            format: int32
            minimum: 0
            maximum: 999999999
            default: 0
      externalDocs:
        description: 内部処理のMarkdown設計書
        url: ./%E8%A8%AD%E8%A8%88%E6%9B%B8_5.6.1.%E3%81%8A%E7%9F%A5%E3%82%89%E3%81%9B%E6%83%85%E5%A0%B1%E4%B8%80%E8%A6%A7%E5%8F%96%E5%BE%97API.md
    post:
      tags:
        - News
      operationId: rootCreateNews
      summary: お知らせ情報登録API
      description: お知らせのメタデータをDBへ登録し、本文をS3 JSONとして保存してSlackへ通知する。 内部処理は「設計書_5.6.2.お知らせ情報登録API.md」を参照する。 DB登録後にS3へアップロードしてSlack通知する。全体をまとめたトランザクションはなく、外部処理失敗時にDB行だけ残る場合がある。
      responses:
        '200':
          description: 処理に成功した。作成・更新内容やIDは返さない。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RootSuccess'
              example:
                result: '0'
        '400':
          $ref: '#/components/responses/RootBadRequest'
        '500':
          $ref: '#/components/responses/RootInternalServerError'
        default:
          description: JWT認証フィルタや共通HTTP処理の応答。コントローラのresult/errors形式および固定の認証エラーステータスは保証しない。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RootNewsCreateRequest'
            example:
              title: お知らせ
              date: 2026/11/11
              detail: 健康管理アプリのお知らせです。
              tag:
                color: blue
                name: お知らせ
      externalDocs:
        description: 内部処理のMarkdown設計書
        url: ./%E8%A8%AD%E8%A8%88%E6%9B%B8_5.6.2.%E3%81%8A%E7%9F%A5%E3%82%89%E3%81%9B%E6%83%85%E5%A0%B1%E7%99%BB%E9%8C%B2API.md
  /api/root/news/{seq_news_info_id}:
    put:
      tags:
        - News
      operationId: rootEditNews
      summary: お知らせ情報編集API
      description: 既存お知らせのS3 JSONを読み込み、タイトル・日付文字列・本文を変更して同じキーへ保存する。 内部処理は「設計書_5.6.3.お知らせ情報編集API.md」を参照する。 tag自体は必須だが、BeanUtilは要求TagとNewsDto.Tagの型が異なるためコピーせず、既存タグを保持する。DBのUPDATE_DATEは更新しない。対象DB行なしは400・news_info is not found。
      responses:
        '200':
          description: 処理に成功した。作成・更新内容やIDは返さない。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RootSuccess'
              example:
                result: '0'
        '400':
          $ref: '#/components/responses/RootBadRequest'
        '500':
          $ref: '#/components/responses/RootInternalServerError'
        default:
          description: JWT認証フィルタや共通HTTP処理の応答。コントローラのresult/errors形式および固定の認証エラーステータスは保証しない。
      parameters:
        - name: seq_news_info_id
          in: path
          required: true
          description: 64ビット符号付き整数。正数限定の検証はない。
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RootNewsEditRequest'
            example:
              title: 更新したお知らせ
              date: 2026/11/11
              detail: 本文を更新します。
              tag:
                color: green
                name: 更新
      externalDocs:
        description: 内部処理のMarkdown設計書
        url: ./%E8%A8%AD%E8%A8%88%E6%9B%B8_5.6.3.%E3%81%8A%E7%9F%A5%E3%82%89%E3%81%9B%E6%83%85%E5%A0%B1%E7%B7%A8%E9%9B%86API.md
    delete:
      tags:
        - News
      operationId: rootDeleteNews
      summary: お知らせ情報削除API
      description: お知らせ情報をDBで論理削除した後、対応するS3 JSONを削除してSlackへ通知する。 内部処理は「設計書_5.6.4.お知らせ情報削除API.md」を参照する。 DBは物理削除せずDELETE_FLAG=trueに更新し、S3 JSONを削除してSlackへ通知する。既に削除済みのDB行も主キー検索の対象となる。対象DB行なしは400・news_info is not found。
      responses:
        '200':
          description: 処理に成功した。作成・更新内容やIDは返さない。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RootSuccess'
              example:
                result: '0'
        '400':
          $ref: '#/components/responses/RootBadRequest'
        '500':
          $ref: '#/components/responses/RootInternalServerError'
        default:
          description: JWT認証フィルタや共通HTTP処理の応答。コントローラのresult/errors形式および固定の認証エラーステータスは保証しない。
      parameters:
        - name: seq_news_info_id
          in: path
          required: true
          description: 64ビット符号付き整数。正数限定の検証はない。
          schema:
            type: integer
            format: int64
      externalDocs:
        description: 内部処理のMarkdown設計書
        url: ./%E8%A8%AD%E8%A8%88%E6%9B%B8_5.6.4.%E3%81%8A%E7%9F%A5%E3%82%89%E3%81%9B%E6%83%85%E5%A0%B1%E5%89%8A%E9%99%A4API.md
  /api/root/user:
    post:
      operationId: rootRegisterAdminUser
      summary: 管理者サイトユーザを登録する
      tags:
        - RootAdminUser
      security: []
      description: 認証不要。passwordとconf_passwordの一致を確認し、照会権限01を付けたユーザをトランザクションで作成する。有効期限はシステム日付の6か月後。登録失敗は400 data regist error。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RootAdminUserRegisterRequest'
      responses:
        '200':
          description: 正常終了。resultは文字列の0。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RootAdminUserRegisterResponse'
        '400':
          $ref: '#/components/responses/RootBadRequest'
        '500':
          $ref: '#/components/responses/RootInternalServerError'
        default:
          description: 認証フィルター、未対応メソッド、実行環境等の共通応答。コントローラのresult/errors形式とは限らない。
      externalDocs:
        description: 内部処理のMarkdown設計書
        url: ./%E8%A8%AD%E8%A8%88%E6%9B%B8_5.2.1.%E7%AE%A1%E7%90%86%E8%80%85%E3%82%B5%E3%82%A4%E3%83%88%E3%83%A6%E3%83%BC%E3%82%B6%E7%99%BB%E9%8C%B2API.md
  /api/root/user/{seq_login_id}:
    put:
      operationId: rootEditAdminUser
      summary: 管理者サイトユーザを編集する
      tags:
        - RootAdminUser
      parameters:
        - name: seq_login_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            description: 編集するログインID。正数制約はない。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RootAdminUserEditRequest'
      description: 結合検索結果がなければ400 data illegal error。権限詳細置き換えとログイン情報更新を同一トランザクションで行い、失敗は400 data update error。
      responses:
        '200':
          description: 正常終了。resultは文字列の0。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RootSuccess'
        '400':
          $ref: '#/components/responses/RootBadRequest'
        '500':
          $ref: '#/components/responses/RootInternalServerError'
        default:
          description: 認証フィルター、未対応メソッド、実行環境等の共通応答。コントローラのresult/errors形式とは限らない。
      externalDocs:
        description: 内部処理のMarkdown設計書
