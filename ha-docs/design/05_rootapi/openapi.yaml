components:
  securitySchemes:
    RootBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: POST /api/root/loginのAuthorization応答ヘッダーから取得したJWTをBearer接頭辞付きで送信する。
  schemas:
    RootSuccess:
      type: object
      required:
        - result
      properties:
        result:
          type: string
          const: '0'
        paging:
          $ref: '#/components/schemas/RootPaging'
      additionalProperties: true
    RootError:
      type: object
      required:
        - result
      properties:
        result:
          type: string
          const: '1'
        errors:
          type: array
          items:
            type: object
            properties:
              message:
                type:
                  - string
                  - 'null'
        paging:
          $ref: '#/components/schemas/RootPaging'
      additionalProperties: true
    RootPaging:
      type: object
      properties:
        total_record_num:
          type: integer
          format: int64
        from_record_num:
          type: integer
          format: int64
        to_record_num:
          type: integer
          format: int64
        total_page:
          type: integer
          format: int64
        current_page_num:
          type: integer
          format: int32
        record_per_page:
          type: integer
          format: int32
        can_go_next:
          type: boolean
        can_go_previous:
          type: boolean
        can_go_last:
          type: boolean
        can_go_first:
          type: boolean
        next_href:
          type:
            - string
            - 'null'
        previous_href:
          type:
            - string
            - 'null'
        last_href:
          type:
            - string
            - 'null'
        first_href:
          type:
            - string
            - 'null'
      description: PagingViewのJSON項目。リンクと件数は各APIが指定したページ・URL・検索件数から算出する。
    RootLoginRequest:
      type: object
      required:
        - seq_login_id
        - password
      properties:
        seq_login_id:
          type: integer
          format: int64
